server {
    listen 80;
    server_name localhost;

    # GZIP Compression (Fast Loading)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    # Bloqueia Clickjacking (não permite colocar em iframe falso)
    add_header X-Frame-Options "DENY" always;
    # Previne XSS (Cross-Site Scripting)
    add_header X-XSS-Protection "1; mode=block" always;
    # Previne ataques de confusão MIME
    add_header X-Content-Type-Options "nosniff" always;
    # Protege contra vazamento de referenciadores
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # Essencial para aplicações React/Vite (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
